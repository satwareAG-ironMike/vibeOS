name: publish docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a run that is mid-push: a cancelled publish leaves the tag
  # pointing at whatever landed last, so a green run would not be the one
  # that shipped. Only coalesce on branches that do not publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # least privilege: nothing after checkout pushes, so the token
          # must not persist in .git/config (clears the artipacked vector)
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # hardcoded fork namespace, not ${{ github.repository }}: the fork is
          # the canonical project (all builds/tests/dev happen here), the
          # GITHUB_TOKEN can only write to its own namespace, and a stable name
          # keeps the published tag from moving if the repo is renamed.
          images: ghcr.io/satwareag-ironmike/vibeos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          # build-push-action applies these OVER the Dockerfile's LABELs, so the
          # Dockerfile is not the source of truth for anything listed here.
          # metadata-action defaults image.url to the repo and derives licenses
          # from GitHub's detection, which silently blanked both.
          labels: |
            org.opencontainers.image.url=https://vibeos.sh/?ref=ghcr
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build is not evidence of a multi-arch manifest — issue #13 was a
      # successful push that shipped arm64 only. Assert the published tag really
      # resolves on both platforms before calling the job done.
      - name: verify published manifest is multi-arch
        env:
          IMAGE: ghcr.io/satwareag-ironmike/vibeos@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE"

          # The manifest must be a list, and must advertise both platforms.
          published=$(docker buildx imagetools inspect "$IMAGE" --raw |
            jq -r '.manifests[]? | select(.platform.os != "unknown")
                   | "\(.platform.os)/\(.platform.architecture)"' | sort -u)
          echo "published platforms: ${published:-<none — not a manifest list>}"

          for platform in linux/amd64 linux/arm64; do
            grep -qx "$platform" <<<"$published" || {
              echo "::error::$IMAGE does not publish $platform"
              exit 1
            }

            # And it has to actually pull, not just be listed.
            #
            # Pull the per-platform digest, NOT `--platform <p> <index-digest>`.
            # Pulling the same index digest twice with different --platform
            # values fails the second time with "cannot overwrite digest": the
            # local store keys on the digest, so the arm64 pull collides with
            # the amd64 one already stored under it. The image is fine; the
            # check is what breaks. Per-platform digests are distinct, so they
            # coexist.
            digest=$(docker buildx imagetools inspect "$IMAGE" --raw |
              jq -r --arg p "$platform" '.manifests[]
                     | select("\(.platform.os)/\(.platform.architecture)" == $p)
                     | .digest')
            docker pull --quiet "ghcr.io/satwareag-ironmike/vibeos@$digest" >/dev/null
          done

      # The tools below are invoked as shell strings from the agent's system
      # prompt (src/app/api/chat/route.ts), so they are invisible to bun install
      # and to dependabot. `npx puppeteer browsers install chrome` failed on
      # arm64 with exit 1 and no output for months while CI stayed green and the
      # image shipped with no browser. Assert they exist, in the running
      # container, as the user the entrypoint actually runs as.
      - name: smoke test shelled-out binaries
        env:
          IMAGE: ghcr.io/satwareag-ironmike/vibeos@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"

            # Per-platform digest, for the same reason as the step above: the
            # second `--platform <p> <index-digest>` collides in the local store.
            digest=$(docker buildx imagetools inspect "$IMAGE" --raw |
              jq -r --arg p "$platform" '.manifests[]
                     | select("\(.platform.os)/\(.platform.architecture)" == $p)
                     | .digest')

            # No command argument — this must start the real CMD, so that a
            # daemon dying at startup takes the container down via `wait -n`
            # and is caught by the State.Running check below.
            cid=$(docker run -d --platform "$platform" "ghcr.io/satwareag-ironmike/vibeos@$digest")
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

            # If the entrypoint died, `docker exec` reports "container not
            # running" and hides the real reason. Surface the logs instead.
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              echo "::error::[$platform] container exited on startup:"
              docker logs "$cid" || true
              exit 1
            fi

            # uvx: src/server/api/routers/{browser-use,dedalus}.ts spawn it to
            # fetch `browser-use` / `dedalus-labs` from PyPI at first call.
            # NOTE: `uvx --version` proves only that uv is installed. It does
            # NOT prove `browser-use` or `dedalus-labs` resolve from PyPI at
            # first call — those are unpinned and fetched at runtime.
            for probe in "bun --version" "chromium --version" "uvx --version" \
                         "jq --version" "npm --version"; do
              if out=$(docker exec "$cid" sh -lc "$probe" 2>&1); then
                echo "ok: $probe -> $out"
              else
                echo "::error::[$platform] \`$probe\` failed in the built image:"
                echo "$out"
                docker logs "$cid" || true
                exit 1
              fi
            done

            # `mcp --version` and `mcp --help` both exit 0 on an install
            # where dist/ was never built — oclif answers them without loading
            # a command class. `daemon --help` forces the daemon command class
            # to load, which imports dist/, so it fails loudly on exactly the
            # broken install. Don't run `mcp daemon` itself: the CMD already
            # holds its port, and a hang before bind is indistinguishable from
            # healthy-and-serving.
            if out=$(docker exec "$cid" sh -lc \
                  '/app/node_modules/.bin/mcp daemon --help' 2>&1); then
              echo "ok: mcp daemon command class loads"
            else
              echo "::error::[$platform] \`mcp daemon --help\` failed — dist/ is probably missing:"
              echo "$out"
              exit 1
            fi


            # The supervisor script must exist and be executable at the path
            # the CMD names. It is started OUTSIDE the `wait -n` set, so if the
            # path is wrong bash prints "no such file or directory" into the
            # logs and the container boots healthy with no browser and no
            # supervisor. The CDP check below would catch that, but it would
            # report "chromium never came up" — true, and the wrong cause. A
            # rename is exactly the change that ships this.
            if out=$(docker exec "$cid" sh -lc \
                  'test -x /app/scripts/browser-supervise.sh && echo present' 2>&1); then
              echo "ok: supervisor script $out and executable"
            else
              echo "::error::[$platform] /app/scripts/browser-supervise.sh missing or not executable — the CMD references it:"
              docker exec "$cid" sh -lc 'ls -l /app/scripts/ 2>&1' || true
              exit 1
            fi

            # The local CDP port must be bound to loopback ONLY. An
            # unauthenticated CDP endpoint is equivalent to remote code
            # execution and can navigate file:// to read this container's
            # filesystem, so a wildcard bind would expose the host the moment
            # anyone published the port.
            #
            # chromium is passed --remote-debugging-address=127.0.0.1, but a
            # flag only states intent: this is what enforces it. A comment
            # cannot, and a chromium default could change silently.
            #
            # Read from /proc/net/tcp rather than `ss`: iproute2 is not in the
            # image, and a probe that needs a missing binary fails as a false
            # red on a healthy image. 2406 is hex for 9222; 0100007F is
            # 127.0.0.1 little-endian, 00000000 is the wildcard bind.
            #
            # Filter on st == 0A (LISTEN). /proc/net/tcp also lists ESTABLISHED
            # connections, and a connection ACCEPTED by a wildcard-bound socket
            # has local_address 127.0.0.1 — so matching the address alone lets a
            # connection vouch for the listener and passes on exactly the
            # wildcard bind this exists to catch. Not hypothetical: the Next app
            # connects to CDP over loopback, so that line is essentially always
            # present in a running container.
            #
            # IPv4 only. An IPv6-only bind therefore reads as "no listener" and
            # errors, which is failing closed and intended. If /proc/net/tcp6 is
            # ever added here, it needs the same 0A filter or it reintroduces
            # the bug above.
            for _ in $(seq 1 15); do
              listeners=$(docker exec "$cid" sh -lc \
                'awk "\$4 == \"0A\" && \$2 ~ /:2406$/ {print \$2}" /proc/net/tcp' || true)
              if [ -n "$listeners" ]; then break; fi
              sleep 2
            done
            if [ -z "$listeners" ]; then
              echo "::error::[$platform] nothing is LISTENING on 9222 — chromium never came up:"
              docker logs "$cid" 2>&1 | tail -30 || true
              exit 1
            fi
            bad=$(echo "$listeners" | grep -vi '^0100007F:2406$' || true)
            if [ -n "$bad" ]; then
              echo "::error::[$platform] CDP port is NOT bound to loopback only:"
              echo "$bad"
              exit 1
            fi
            echo "ok: CDP listener bound to 127.0.0.1:9222 only"

            docker rm -f "$cid" >/dev/null
            trap - EXIT
            echo "::endgroup::"
          done

      # Zero-cost supply-chain signatures (issue #8): keyless Sigstore OIDC,
      # no keys, no services. Runs only after the multi-arch + smoke asserts
      # above pass, so a broken image is never attested.
      - name: generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/satwareag-ironmike/vibeos@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # the full image SBOM (39k file entries with per-file digests) exceeds
          # the 16 MiB cap of the attestation API; the syft config drops
          # file-level metadata - see sbom-syft-config.yaml
          config: .github/sbom-syft-config.yaml
          # pin the scanner version so the SBOM is reproducible run-to-run
          # (the action's installer needs the release-tag form: v1.54.0, not 1.54.0)
          syft-version: v1.54.0

      - name: attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/satwareag-ironmike/vibeos
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/satwareag-ironmike/vibeos
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
